<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroPatch — Tüm Ürünler</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--border:#2a2a2a;--accent:#c8a96e;--accent2:#e63946;--text:#e8e8e8;--muted:#888;--card:#141414;}
    *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;overflow-x:hidden;}
    ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);}

    nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:rgba(10,10,10,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
    .logo{text-decoration:none;display:flex;align-items:center;}
    .logo img{height:34px;width:auto;}
    nav ul{display:flex;gap:28px;list-style:none;}
    nav ul a{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s;}
    nav ul a:hover,nav ul a.active-link{color:var(--accent);}
    .nav-cta{background:var(--accent);color:#000!important;padding:8px 20px;font-weight:700!important;}

    .page-header{padding:120px 40px 60px;max-width:1280px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;}
    .page-header-left .section-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
    .page-header-left h1{font-family:'Bebas Neue',cursive;font-size:clamp(40px,7vw,80px);letter-spacing:3px;line-height:1;}
    .prod-count{font-family:'Bebas Neue',cursive;font-size:80px;color:var(--border);letter-spacing:2px;line-height:1;}

    .toolbar{padding:0 40px 32px;max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
    .filter-bar{display:flex;gap:6px;flex-wrap:wrap;}
    .filter-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:8px 18px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s;}
    .filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(200,169,110,0.07);}
    .sort-select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;outline:none;cursor:pointer;}
    .sort-select option{background:var(--bg3);}
    .search-wrap{position:relative;}
    .search-wrap input{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 14px 8px 36px;font-family:'Barlow',sans-serif;font-size:13px;outline:none;width:200px;transition:border-color .2s;}
    .search-wrap input:focus{border-color:var(--accent);}
    .search-wrap::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;}

    .products-wrap{padding:0 40px 80px;max-width:1280px;margin:0 auto;}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px;}
    .product-card{background:var(--card);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:all .3s;}
    .product-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 24px 48px rgba(0,0,0,0.5);}
    .product-img{width:100%;aspect-ratio:1;background:var(--bg3);overflow:hidden;position:relative;}
    .product-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
    .product-card:hover .product-img img{transform:scale(1.09);}
    .product-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;}
    .product-card:hover .product-overlay{opacity:1;}
    .quick-btn{background:var(--accent);color:#000;border:none;padding:10px 22px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
    .product-info{padding:14px 16px;border-top:1px solid var(--border);}
    .product-cat{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
    .product-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .product-bottom{display:flex;align-items:center;justify-content:space-between;}
    .product-price{font-family:'Bebas Neue',cursive;font-size:22px;color:var(--accent);}
    .product-badge{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;background:rgba(200,169,110,0.1);color:var(--accent);border:1px solid rgba(200,169,110,0.25);}
    .badge-out{background:rgba(230,57,70,0.1);color:var(--accent2);border-color:rgba(230,57,70,0.25);}
    .product-stats{display:flex;gap:8px;margin-top:7px;}
    .pstat{font-size:10px;color:var(--muted);}

    .empty-state{grid-column:1/-1;text-align:center;padding:80px;color:var(--muted);}
    .empty-state div{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:3px;margin-top:12px;}

    /* LIGHTBOX */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.97);z-index:9000;display:none;align-items:center;justify-content:center;}
    .lightbox.open{display:flex;}
    .lb-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;}
    .lb-img-wrap img{max-width:88vw;max-height:80vh;object-fit:contain;transform:scale(0.8) rotate(-2deg);opacity:0;transition:all .5s cubic-bezier(.175,.885,.32,1.275);display:block;}
    .lightbox.open .lb-img-wrap img{transform:scale(1) rotate(0deg);opacity:1;}
    .lb-close{position:absolute;top:-44px;right:0;background:none;border:1px solid var(--border);color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .2s;}
    .lb-close:hover{border-color:var(--accent);color:var(--accent);}
    .lb-name{font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:2px;color:var(--accent);text-align:center;}
    .lb-price{font-size:13px;color:var(--muted);text-align:center;margin-top:4px;}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);z-index:8000;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.active{display:flex;}
    .modal{background:var(--card);border:1px solid var(--border);max-width:820px;width:100%;max-height:90vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;position:relative;animation:modalIn .4s cubic-bezier(.175,.885,.32,1.275);}
    @keyframes modalIn{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}
    .modal-img{background:var(--bg3);min-height:280px;overflow:hidden;cursor:zoom-in;position:relative;}
    .modal-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
    .modal-img:hover img{transform:scale(1.06);}
    .modal-zoom-hint{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.7);color:var(--accent);font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;padding:4px 8px;}
    .modal-body{padding:30px;}
    .modal-close{position:absolute;top:10px;right:10px;background:var(--bg3);border:1px solid var(--border);color:var(--text);width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;z-index:10;transition:all .2s;}
    .modal-close:hover{border-color:var(--accent);color:var(--accent);}
    .modal-cat{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:7px;}
    .modal-name{font-family:'Bebas Neue',cursive;font-size:26px;letter-spacing:2px;margin-bottom:10px;}
    .modal-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px;}
    .modal-specs{border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:10px 0;margin-bottom:14px;}
    .modal-spec{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;}
    .modal-spec-key{color:var(--muted);}
    .modal-spec-val{font-weight:600;}
    .modal-price{font-family:'Bebas Neue',cursive;font-size:34px;color:var(--accent);margin-bottom:12px;}
    .modal-order-btn{width:100%;background:var(--accent);color:#000;border:none;padding:12px;font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:3px;cursor:pointer;transition:all .2s;margin-bottom:6px;}
    .modal-order-btn:hover{background:#d4b77a;}
    .modal-zoom-btn{width:100%;background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all .2s;}
    .modal-zoom-btn:hover{border-color:var(--accent);color:var(--accent);}

    .toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#000;padding:12px 20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;z-index:99999;transform:translateY(60px);opacity:0;transition:all .35s cubic-bezier(.175,.885,.32,1.275);}
    .toast.show{transform:translateY(0);opacity:1;}

    @media(max-width:768px){
      nav{padding:0 16px;}nav ul{display:none;}
      .page-header{padding:100px 20px 40px;flex-direction:column;align-items:flex-start;}
      .prod-count{font-size:48px;}
      .toolbar{padding:0 20px 24px;flex-direction:column;align-items:flex-start;}
      .search-wrap input{width:100%;}
      .products-wrap{padding:0 20px 60px;}
      .modal{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo"><img src="retro_logo.png" alt="RetroPatch"></a>
  <ul>
    <li><a href="index.html">Ana Sayfa</a></li>
    <li><a href="urunler.html" class="active-link">Tüm Ürünler</a></li>
    <li><a href="index.html#siparis">Sipariş</a></li>
    <li><a href="index.html#iletisim">İletişim</a></li>
    <li id="navCartLi" style="display:none"><a href="sepet.html">🛒 <span id="cartCount">0</span></a></li>
    <li id="navHesapLi" style="display:none"><a href="hesap.html">Hesabım</a></li>
    <li id="navLoginLi"><a href="uye.html" class="nav-cta">Giriş Yap</a></li>
  </ul>
</nav>

<div class="page-header">
  <div class="page-header-left">
    <div class="section-label">Katalog</div>
    <h1>TÜM ÜRÜNLER</h1>
  </div>
  <div class="prod-count" id="prodCount">0</div>
</div>

<div class="toolbar">
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="filterCat('Tümü',this)">Tümü</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Ara..." oninput="doSearch()">
    </div>
    <select class="sort-select" onchange="doSort(this.value)">
      <option value="default">Sıralama</option>
      <option value="price_asc">Fiyat ↑</option>
      <option value="price_desc">Fiyat ↓</option>
      <option value="sales">En Çok Satan</option>
      <option value="favorites">En Çok Favorilenen</option>
      <option value="reviews">En Çok Yorum Alan</option>
      <option value="name">A-Z</option>
    </select>
  </div>
</div>

<div class="products-wrap">
  <div class="products-grid" id="productsGrid">
    <div class="empty-state"><div>YÜKLENİYOR...</div></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLB(event)">
  <div class="lb-inner">
    <button class="lb-close" onclick="document.getElementById('lightbox').classList.remove('open')">✕</button>
    <div class="lb-img-wrap"><img id="lbImg" src="" alt=""></div>
    <div class="lb-name" id="lbName"></div>
    <div class="lb-price" id="lbPrice"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeMBg(event)">
  <div class="modal">
    <div class="modal-img" id="modalImg" onclick="openLB()">
      <div class="modal-zoom-hint">🔍 Büyütmek için tıkla</div>
    </div>
    <div class="modal-body">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-cat" id="modalCat"></div>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-specs" id="modalSpecs"></div>
      <div class="modal-price" id="modalPrice"></div>
      <button class="modal-order-btn" onclick="addToCartFromModal()">🛒 SEPETE EKLE</button>
      <button class="modal-zoom-btn" onclick="openLB()">🔍 Tam Ekran Gör</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyA597pu8o7M2ZWcZc6gbGW2TAwceTfyVhA",
  authDomain:"retropatch-fd08e.firebaseapp.com",
  projectId:"retropatch-fd08e",
  storageBucket:"retropatch-fd08e.firebasestorage.app",
  messagingSenderId:"449894507687",
  appId:"1:449894507687:web:a932684047bd590579e782"
});
const db = firebase.firestore();
const auth = firebase.auth();

// Auth durumuna göre navbar güncelle
auth.onAuthStateChanged(user => {
  document.getElementById('navCartLi').style.display = user ? 'list-item' : 'none';
  document.getElementById('navHesapLi').style.display = user ? 'list-item' : 'none';
  document.getElementById('navLoginLi').style.display = user ? 'none' : 'list-item';
  updateCartCount();
});

let allProducts = [];
let filtered = [];
let currentCat = 'Tümü';
let currentSort = 'default';
let currentProduct = null;

db.collection('products').onSnapshot(snap => {
  allProducts = snap.docs.map(d => ({id:d.id,...d.data()}));
  buildFilters();
  applyAll();
});

function buildFilters() {
  const cats = ['Tümü',...new Set(allProducts.map(p=>p.cat).filter(Boolean))];
  const bar = document.getElementById('filterBar');
  bar.innerHTML = cats.map((c,i)=>`<button class="filter-btn${c===currentCat?' active':''}" onclick="filterCat('${c}',this)">${c}</button>`).join('');
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyAll();
}

function doSort(val) { currentSort = val; applyAll(); }

function doSearch() { applyAll(); }

function applyAll() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  filtered = allProducts.filter(p => {
    const matchCat = currentCat === 'Tümü' || p.cat === currentCat;
    const matchQ = !q || (p.name||'').toLowerCase().includes(q) || (p.cat||'').toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  if (currentSort==='price_asc') filtered.sort((a,b)=>(a.price||0)-(b.price||0));
  else if (currentSort==='price_desc') filtered.sort((a,b)=>(b.price||0)-(a.price||0));
  else if (currentSort==='sales') filtered.sort((a,b)=>(b.sales||0)-(a.sales||0));
  else if (currentSort==='favorites') filtered.sort((a,b)=>(b.favorites||0)-(a.favorites||0));
  else if (currentSort==='reviews') filtered.sort((a,b)=>(b.reviews||0)-(a.reviews||0));
  else if (currentSort==='name') filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  document.getElementById('prodCount').textContent = filtered.length;
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('productsGrid');
  if (!filtered.length) {
    grid.innerHTML='<div class="empty-state"><div style="font-size:40px;opacity:.2;">🏷</div><div>ÜRÜN BULUNAMADI</div></div>';
    return;
  }
  grid.innerHTML = filtered.map(p=>`
    <div class="product-card" onclick="openModal('${p.id}')">
      <div class="product-img">
        <img src="${p.image||''}" alt="${p.name}" loading="lazy" onerror="this.parentElement.style.background='var(--bg3)';this.style.display='none'">
        <div class="product-overlay"><button class="quick-btn" onclick="event.stopPropagation();openModal('${p.id}')">İNCELE</button></div>
      </div>
      <div class="product-info">
        <div class="product-cat">${p.cat||''}</div>
        <div class="product-name">${p.name||''}</div>
        <div class="product-bottom">
          <div class="product-price">${p.price?'₺'+p.price:'—'}</div>
          <div class="product-badge${p.status==='Tükendi'?' badge-out':''}">${p.status||'Stokta'}</div>
        </div>
        <div class="product-stats">
          <span class="pstat">🔥 ${p.sales||0}</span>
          <span class="pstat">❤️ ${p.favorites||0}</span>
          <span class="pstat">⭐ ${p.reviews||0}</span>
        </div>
        <button onclick="event.stopPropagation();addToCart(${JSON.stringify(p).replace(/"/g,'&quot;')});showToast('✓ Sepete eklendi!')" style="margin-top:10px;width:100%;background:var(--accent);color:#000;border:none;padding:9px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer;">🛒 SEPETE EKLE</button>
      </div>
    </div>`).join('');
}

function openModal(id) {
  const p = allProducts.find(x=>x.id===id);
  if (!p) return;
  currentProduct = p;
  document.getElementById('modalCat').textContent = p.cat||'';
  document.getElementById('modalName').textContent = p.name||'';
  document.getElementById('modalDesc').textContent = p.desc||'';
  document.getElementById('modalPrice').textContent = p.price?'₺'+p.price:'—';
  document.getElementById('modalSpecs').innerHTML = `
    <div class="modal-spec"><span class="modal-spec-key">Boyut</span><span class="modal-spec-val">${p.size||'—'}</span></div>
    <div class="modal-spec"><span class="modal-spec-key">Arka</span><span class="modal-spec-val">${p.back||'—'}</span></div>
    <div class="modal-spec"><span class="modal-spec-key">Durum</span><span class="modal-spec-val">${p.status||'Stokta'}</span></div>
    <div class="modal-spec"><span class="modal-spec-key">Satış</span><span class="modal-spec-val">🔥 ${p.sales||0}</span></div>
    <div class="modal-spec"><span class="modal-spec-key">Favori</span><span class="modal-spec-val">❤️ ${p.favorites||0}</span></div>
    <div class="modal-spec"><span class="modal-spec-key">Yorum</span><span class="modal-spec-val">⭐ ${p.reviews||0}</span></div>`;
  const mi = document.getElementById('modalImg');
  mi.innerHTML = p.image
    ? `<img src="${p.image}" alt="${p.name}"><div class="modal-zoom-hint">🔍 Büyütmek için tıkla</div>`
    : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#444;">Görsel Yok</div>`;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow='hidden';
  db.collection('products').doc(id).update({views:firebase.firestore.FieldValue.increment(1)}).catch(()=>{});
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('active');document.body.style.overflow='';}
function closeMBg(e){if(e.target===document.getElementById('modalOverlay'))closeModal();}
function goOrder(){closeModal();window.location.href='index.html#siparis';}

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('retropatch_cart')||'[]');
  const count = cart.reduce((s,i)=>s+(i.qty||1),0);
  const el = document.getElementById('cartCount');
  if (el) el.textContent = count > 0 ? count : '0';
}

function addToCart(p) {
  let cart = JSON.parse(localStorage.getItem('retropatch_cart')||'[]');
  const existing = cart.find(i=>i.id===p.id);
  if (existing) existing.qty = (existing.qty||1)+1;
  else cart.push({id:p.id,name:p.name,price:p.price,image:p.image||'',cat:p.cat||'',qty:1});
  localStorage.setItem('retropatch_cart', JSON.stringify(cart));
  updateCartCount();
}

function addToCartFromModal() {
  if (!currentProduct) return;
  addToCart(currentProduct);
  showToast('✓ Sepete eklendi!');
  closeModal();
  window.location.href = 'sepet.html';
}

function openLB() {
  if (!currentProduct?.image) return;
  document.getElementById('lbImg').src = currentProduct.image;
  document.getElementById('lbName').textContent = currentProduct.name||'';
  document.getElementById('lbPrice').textContent = currentProduct.price?'₺'+currentProduct.price:'';
  document.getElementById('lightbox').classList.add('open');
}
function closeLB(e){if(!e||e.target===document.getElementById('lightbox'))document.getElementById('lightbox').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('lightbox').classList.remove('open');}});

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
</script>
</body>
</html>
